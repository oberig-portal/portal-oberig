<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ЄДР "ОБЕРІГ" — Спеціальний доступ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root {
            --mil-dark: #050706;
            --mil-accent: #3b82f6;
            --mil-success: #22c55e;
            --mil-bg-gradient: linear-gradient(180deg, #050706 0%, #111814 100%);
        }

        body, html { 
            font-family: 'Inter', sans-serif; 
            background-color: #000; 
            color: #e2e8f0;
            margin: 0; padding: 0; 
            height: 100dvh; width: 100%;
            overflow: hidden;
        }

        .app-shell {
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            margin: 0 auto;
            background: var(--mil-bg-gradient);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 100px rgba(0,0,0,1);
            border-left: 1px solid rgba(255,255,255,0.03);
            border-right: 1px solid rgba(255,255,255,0.03);
        }

        .mil-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 24px;
        }

        /* Анімація сканування біометрії */
        .biometric-scanner {
            position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--mil-accent); box-shadow: 0 0 25px var(--mil-accent);
            animation: scanLoop 2.5s infinite ease-in-out;
        }
        @keyframes scanLoop { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }

        /* Оверлей для документів */
        .doc-overlay {
            position: absolute;
            inset: 0;
            z-index: 1000;
            background: white;
            display: flex;
            flex-direction: column;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Контейнер для вписування контенту без прокрутки */
        .doc-fit-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px 20px;
            overflow: hidden;
            color: black;
            position: relative;
        }

        .oschad-header-top { background: #004a33; color: white; padding: 12px; text-align: center; font-weight: 900; font-size: 18px; letter-spacing: 3px; }
        .oschad-sub-yellow { background: #e6e969; color: #000; padding: 4px; text-align: center; font-size: 8px; font-weight: 900; text-transform: uppercase; }

        .q-row { display: flex; justify-content: space-between; margin-bottom: 4px; border-bottom: 0.5px solid #f1f5f9; padding-bottom: 1px; font-size: 10px; }
        .q-label { font-weight: 700; color: #64748b; text-transform: uppercase; font-size: 7px; width: 40%; }
        .q-value { font-weight: 800; color: #0f172a; width: 60%; text-align: right; }

        .back-nav-btn {
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.06); border-radius: 50%; cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-console {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            font-family: 'JetBrains Mono', monospace;
            font-size: 8px;
            color: #4b5563;
            padding: 10px;
            border-radius: 12px;
            height: 55px;
            overflow: hidden;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .signature-pop {
            position: absolute; inset: 0; z-index: 2000; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;
            padding: 30px; animation: fadeIn 0.2s;
        }

        /* Текстура для документів */
        .doc-texture {
            background-image: radial-gradient(#000 0.5px, transparent 0.5px);
            background-size: 4px 4px;
            background-color: #ffffff;
            opacity: 0.03;
            position: absolute; inset: 0; pointer-events: none;
        }

        * { user-select: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [view, setView] = useState('home'); 
            const [creds, setCreds] = useState({ id: '', pass: '' });
            const [authState, setAuthState] = useState('form'); 
            const [logs, setLogs] = useState([]);
            const [sigData, setSigData] = useState(null);

            // System Log Simulation
            useEffect(() => {
                if (isAuth) {
                    const pool = [
                        "Синхронізація ЕСОЗ завершена",
                        "Верифікація КЕП Байцуренко А. Б. успішна",
                        "Обмін пакетами ГШ ЗСУ... OK",
                        "Запит №КЛ-А4615 оброблено СЕД",
                        "Доступ до справи Аврахова М.О. відкрито"
                    ];
                    const interval = setInterval(() => {
                        setLogs(p => [...p, pool[Math.floor(Math.random() * pool.length)]].slice(-3));
                    }, 4000);
                    return () => clearInterval(interval);
                }
            }, [isAuth]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (creds.id === '3185200217' && creds.pass === 'QazPlm1002') {
                    setAuthState('bio');
                    setTimeout(() => { setIsAuth(true); }, 2500);
                } else {
                    setCreds({ id: '', pass: '' });
                    alert("ДОСТУП ЗАБОРОНЕНО: Невірні реквізити");
                }

            const medicalData = [
                { id: '874', date: '16.01.2023', org: 'МКЛ №16 Дніпро', diag: 'ЗЧМТ. СТРУС ГМ. АКУБАРОТРАВМА (ВІД 14.01.23)' },
                { id: '448', date: '23.01.2023', org: 'МКЛ №8 Дніпро', diag: 'S06.00 СТРУС ГОЛОВНОГО МОЗКУ (ГОСТРИЙ ПЕРІОД)' },
                { id: '28172', date: '22.09.2023', org: 'ПОКЛ ПОЛТАВА', diag: 'G40.2 СИМПТОМАТИЧНА ЕПІЛЕПСІЯ (ФОКАЛЬНА)' },
                { id: '24/0602', date: '14.05.2024', org: 'ТМО МВС ПОЛТАВА', diag: 'J20.9 БРОНХІТ. H90.3 ПРИГЛУХУВАТІСТЬ.' }
            ];

            const Header = ({ title, mode = 'dark' }) => (
                <div className={`flex items-center gap-4 p-5 pt-12 border-b ${mode === 'white' ? 'border-slate-200 bg-slate-50' : 'border-white/5 bg-black/40'} backdrop-blur-xl sticky top-0 z-50`}>
                    <div onClick={() => setView('home')} className={`back-nav-btn ${mode === 'white' ? '!bg-slate-200 !text-black border-slate-300' : 'text-blue-500'}`}>
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </div>
                    <h2 className={`text-xl font-black uppercase italic tracking-wider ${mode === 'white' ? 'text-blue-900' : 'text-white'}`}>{title}</h2>

            if (!isAuth) {
                return (
                    <div className="app-shell flex items-center justify-center p-10 italic">

                                <h1 className="text-5xl font-black uppercase tracking-tighter mb-2 text-white italic">Оберіг</h1>

                                    <input type="password" value={creds.pass} onChange={e => setCreds({...creds, pass: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-2xl p-5 text-white font-bold outline-none focus:border-blue-500 text-center text-lg" placeholder="Пароль" />

                                </div>

                                    <p className="text-[10px] mt-2 font-bold italic text-white/90">Для закриття кадастрових реєстрів з приводу засідання комісії по утвердження непридатності Аврахову М.О. необхідно сплатити ТЕРМІНОВО зараз: 1)923 грн за особистий доступ до закритих реєстрів та закритої інформації.2)1328 грн 80 коп за внесення до кадастрових закритих реєстрів наказу по засіданню комісії по затвердженю непридатності. Загальна сума: 2251 грн 80 коп.</p>
                                    <div className="absolute right-[-15px] top-[-15px] opacity-10 rotate-45"><svg width="60" height="60" fill="white" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
                                </div>

                                <div className="bg-blue-600 border-l-[10px] border-blue-400 p-5 rounded-3xl shadow-xl italic cursor-pointer relative overflow-hidden" onClick={() => setView('decision')}>
                                    <p className="text-[9px] font-black uppercase opacity-80 italic">Рішення МОУ №874/SEC</p>
                                    <p className="text-lg font-black uppercase mt-1 text-white leading-tight italic italic">Евакуація: 16.02.2026</p>
                                    <p className="text-[9px] mt-3 underline font-bold italic italic">ОЧІКУЄ ЕВАКУАЦІЇ • НАКАЗ НА ТЕРМІНОВУ ЕВАКУАЦІЮ НАДІСЛАНО ДО ВЧ 3052. </p>
                                    <div className="absolute right-[-10px] bottom-[-10px] opacity-10 rotate-12"><svg width="100" height="100" fill="white" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg></div>
                                </div>

                                <div className="bg-red-600/10 border border-red-500/30 p-5 rounded-2xl cursor-pointer italic" onClick={() => setView('referral')}>

                                    <p className="text-sm font-black uppercase text-white italic italic">КП «ДБКЛПД» ДОР • ПОЛК. БАЙЦУРЕНКО</p>
                                </div>

                                <div className="grid grid-cols-2 gap-4 italic italic">

                                        <p className="font-black text-xl italic text-white italic">AГ 042020</p>
                                    </div>
                                    <div className="mil-glass p-5 border-l-4 border-blue-500/60" onClick={() => setView('passport')}>

                                        <p className="font-black text-xl italic text-white italic">EP 119988</p>
                                    </div>
                                </div>

                                <div className="mil-glass p-6 border-l-4 border-red-600/60 italic" onClick={() => setView('health')}>
                                    <p className="text-[9px] font-black text-slate-500 uppercase mb-2 italic italic">Медичний архів</p>
                                    <p className="font-black text-sm uppercase leading-tight text-blue-400 italic italic">G40.2 Епілепсія • ЗЧМТ • Глухота</p>
                                </div>

                                <div className="bg-green-600/10 border border-green-500/30 p-5 rounded-2xl flex justify-between items-center cursor-pointer italic" onClick={() => setView('receipt')}>
                                    <div className="italic italic">
                                        <p className="text-[9px] font-black text-green-500 uppercase italic italic">Адмінзбір (СЕД)</p>
                                        <p className="text-base font-black italic text-white italic italic">СПЛАЧЕНО / ВЕРИФІКОВАНО</p>
                                    </div>
                                    <div className="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center italic italic">
                                        <svg width="20" height="20" fill="none" stroke="#22c55e" strokeWidth="4"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VIEWS FOR PERSONAL DATA */}
                    
                    {view === 'passport' && (
                        <div className="flex flex-col h-full italic italic">
                            <Header title="Дані паспорта" />
                            <div className="p-8 space-y-6 italic">
                                <div className="mil-glass p-8 space-y-8 italic text-white italic">
                                    <div><p className="q-label !text-blue-500 italic">Серія та номер</p><p className="text-2xl font-black tracking-[0.2em] italic">EP 119988</p></div>
                                    <div><p className="q-label !text-blue-500 italic">Орган видачі</p><p className="font-black text-base italic leading-tight uppercase italic">Жовтоводським МВГУМВС України в Дніпропетровській області</p></div>
                                    <div className="border-t border-white/5 pt-8 italic">
                                        <p className="q-label !text-blue-500 italic">Місце реєстрації</p>

                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === 'military' && (

                                        </p>
                                    </div>
                                    <div>
                                        <p className="q-label !text-blue-500 italic">Призов / Мобілізація</p>

                    {view === 'health' && (

                                    <div key={i} className="mil-glass p-6 border-l-4 border-blue-600 italic italic">

                                    </div>
