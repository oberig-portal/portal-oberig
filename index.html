<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ЄДР ОБЕРІГ — Особистий кабінет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { --ios-bg: #F2F2F7; }

        body, html { 
            font-family: 'Inter', sans-serif; 
            background-color: black; 
            color: #1c1c1e;
            margin: 0; padding: 0; 
            height: 100%; width: 100%;
            overflow: hidden;
        }

        .app-shell {
            width: 100%; max-width: 500px; height: 100dvh; margin: 0 auto;
            background: var(--ios-bg); display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .state-header {
            background: linear-gradient(180deg, #0057B7 50%, #FFD700 50%);
            padding: 45px 15px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 2000;
            position: relative;
        }
        .state-header-text {
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
            font-weight: 800;
            font-size: 10px;
            line-height: 1.3;
            text-transform: uppercase;
            text-align: center;
            flex: 1;
        }
        .state-header-text span.accent {
            color: #003a7c;
            text-shadow: none;
        }
        .emblem-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .glass-card {
            background: white; border-radius: 28px;
            border: 1px solid rgba(0,0,0,0.03);
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            transition: all 0.2s ease;
        }

        .army-dark { 
            background: linear-gradient(145deg, #121212 0%, #2a2a2a 100%); 
            position: relative; overflow: hidden;
        }
        
        .army-dark::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(125deg, transparent 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 55%, transparent 100%);
            background-size: 200% 200%; animation: holo 4s infinite linear;
        }
        @keyframes holo { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        .doc-overlay {
            position: absolute; inset: 0; z-index: 1000;
            background: var(--ios-bg); display: flex; flex-direction: column;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow-y: auto;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 24px 4px; font-size: 14px; font-weight: 700;
            position: absolute; top: 0; left: 0; right: 0; z-index: 3000;
        }

        .input-field {
            width: 100%; background: #f2f2f7; border: 2px solid transparent;
            padding: 18px; border-radius: 20px; font-weight: 700;
            transition: all 0.2s; outline: none;
        }
        .input-field:focus { border-color: #000; background: #fff; }

        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid #000;
            border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .qr-overlay, .payment-modal-overlay, .notification-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4);
            z-index: 5000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px;
            backdrop-filter: blur(10px);
        }

        .marquee-container {
            background: #e11d48;
            color: #ffffff;
            padding: 10px 0;
            margin: 5px 0 0 0;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            font-size: 14px;
            border-top: 2px solid rgba(255,255,255,0.2);
            border-bottom: 2px solid rgba(255,255,255,0.2);
            overflow: hidden;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
            display: flex;
            align-items: center;
        }

        .oschad-header {
            background: #004a32; color: white; padding: 40px 20px 10px;
            text-align: center; font-weight: 900; font-size: 24px;
        }
        .oschad-sub {
            background: #004a32; color: #78a394; padding-bottom: 20px;
            text-align: center; font-weight: 700;
        }

        .payment-link-container {
            background: white;
            padding: 12px 24px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .ubd-gradient {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            position: relative;
            overflow: hidden;
        }

        .switch {
            position: relative; display: inline-block; width: 44px; height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; inset: 0; background-color: #ccc;
            transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(20px); }

        .back-btn {
            width: 100%; background: #000; color: #fff; padding: 20px;
            border-radius: 28px; font-weight: 900; text-transform: uppercase;
            font-style: italic; margin-top: 30px; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .bell-container {
            position: relative;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .bell-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 900;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        * { user-select: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [authState, setAuthState] = useState('welcome'); 
            const [loading, setLoading] = useState(false);
            const [paymentLoading, setPaymentLoading] = useState(false);
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [showNotification, setShowNotification] = useState(false);
            const [view, setView] = useState('home'); 
            const [showQR, setShowQR] = useState(false);
            const [time, setTime] = useState(new Date());
            const [rememberMe, setRememberMe] = useState(false);
            
            const [rnokpp, setRnokpp] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const userData = {
                name: "Аврахов Максим Олександрович",
                photo: "https://i.postimg.cc/qM8Y8xDh/IMG-3640.jpg",
                dob: "1987 р.н.",
                rnokpp: "3185200217",
                unit: "в/ч 3052• ОЧІКУЄ ЕВАКУАЦІЇ",
                rank: "Солдат",
                position: "Електрозварник 1-ї майстерні ремонту артилерійського озброєння ремонтного взводу артилерійського озброєння роти з ремонту озброєння автотранспортного батальйону.",
                vos: "Г-131264",
                passport: "EP 119988",
                passportOrg: "Жовтоводським МВГУМВС України в Дніпропетровській області",
                address: "м. Жовті Води, вул. Кропоткіна 7, кв. 79",
                regDate: "26.10.2016",
                blood: "O(I) Rh+",
                mobilization: "02.04.2022 р. за мобілізацією",
                oath: "07.04.2022 р. у в/ч 3052",
                commander: "полковник А. Галущак",
                evacuationDate: "16.02.2026",
                adminFee: "2251,80 ₴",
                ubdNum: "636331",
                ubdOrg: "Головне Управління Національної Гвардії України",
                ubdSign: "Командувач Національної Гвардії України генерал Ю.Лебідь"
            };

            const medicalRecords = [
                { date: "16.01.2023", org: "МКЛ №16 Дніпро", diag: "ЗЧМТ. СТРУС ГМ. АКУБАРОТРАВМА (ВІД 14.01.23)", code: "№874" },
                { date: "23.01.2023", org: "МКЛ №8 Дніпро", diag: "S06.00 СТРУС ГОЛОВНОГО МОЗКУ (ГОСТРИЙ ПЕРІОД)", code: "№448" },
                { date: "22.09.2023", org: "ПОКЛ ПОЛТАВА", diag: "G40.2 СИМПТОМАТИЧНА ЕПІЛЕПСІЯ (ФОКАЛЬНА)", code: "№28172" },
                { date: "14.05.2024", org: "ТМО МВС ПОЛТАВА", diag: "J20.9 БРОНХІТ. H90.3 ПРИГЛУХУВАТІСТЬ.", code: "№24/0602" }
            ];

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');
                if (rnokpp === '3185200217' && password === 'QazPlm1002') {
                    setLoading(true);
                    setTimeout(() => {
                        setAuthState('app');
                        setLoading(false);
                    }, 1500);
                } else {
                    setError('Невірний РНОКПП або пароль');
                }
            };

            const startPaymentProcess = () => {
                setPaymentLoading(true);
                setTimeout(() => {
                    setPaymentLoading(false);
                    setShowPaymentModal(true);
                }, 2500);
            };

            const StatusBar = ({dark = false}) => (
                <div className={`status-bar ${dark ? 'text-white' : 'text-black'}`}>
                    <span>{time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    <div className="flex gap-1.5 items-center italic">
                        <span>LTE</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2zm0 18c4.42 0 8-3.58 8-8s-3.58-8-8-8-8 3.58-8 8 3.58 8 8 8z"/></svg>
                    </div>
                </div>
            );

            const Header = ({ title }) => (
                <div className="flex items-center justify-between p-6 pt-12 bg-white/90 backdrop-blur-xl sticky top-0 z-[1001] border-b border-gray-100">
                    <div className="flex items-center gap-4">
                        <button onClick={() => setView('home')} className="p-2 bg-gray-50 rounded-full active:scale-75 transition-all">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        </button>
                        <h2 className="text-xl font-black tracking-tighter uppercase italic">{title}</h2>
                    </div>
                </div>
            );

            if (authState === 'welcome') {
                return (
                    <div className="app-shell flex flex-col items-center justify-center p-10 bg-white">
                        <StatusBar />
                        <img src="https://i.postimg.cc/CxTqtsKk/photo-output.png" className="w-28 h-28 mb-8 shadow-2xl rounded-[35px]" />
                        <h1 className="text-5xl font-black italic tracking-tighter mb-2 text-center uppercase">ОБЕРІГ</h1>
                        <p className="text-gray-400 font-bold text-xs mb-12 uppercase tracking-[0.2em] text-center">Система верифікації ГШ ЗСУ</p>
                        <button 
                            onClick={() => setAuthState('login')} 
                            className="w-full bg-black text-white py-6 rounded-[32px] font-black text-lg active:scale-95 transition-all shadow-2xl uppercase italic"
                        >
                            Підтвердити особу
                        </button>
                    </div>
                );
            }

            if (authState === 'login') {
                return (
                    <div className="app-shell p-8 bg-white">
                        <StatusBar />
                        <button onClick={() => setAuthState('welcome')} className="mt-12 p-2 bg-gray-100 rounded-full w-10 h-10 flex items-center justify-center">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        </button>
                        
                        <div className="mt-10">
                            <h2 className="text-3xl font-black italic tracking-tighter uppercase mb-2">Авторизація</h2>
                            <p className="text-gray-400 font-bold text-xs uppercase mb-10 italic">Введіть дані для доступу до реєстру</p>
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="text-[10px] font-black uppercase text-gray-400 ml-4 mb-2 block">РНОКПП</label>
                                    <input 
                                        type="number" 
                                        placeholder="10 цифр" 
                                        className="input-field" 
                                        value={rnokpp} 
                                        onChange={(e) => setRnokpp(e.target.value)}
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="text-[10px] font-black uppercase text-gray-400 ml-4 mb-2 block">Пароль доступу</label>
                                    <input 
                                        type="password" 
                                        placeholder="••••••••" 
                                        className="input-field" 
                                        value={password} 
                                        onChange={(e) => setPassword(e.target.value)}
                                        required
                                    />
                                </div>

                                <div className="flex items-center justify-between px-2 pt-2">
                                    <span className="text-xs font-bold text-gray-500 uppercase italic">Запам'ятати мене</span>
                                    <label className="switch">
                                        <input type="checkbox" checked={rememberMe} onChange={() => setRememberMe(!rememberMe)} />
                                        <span className="slider"></span>
                                    </label>
                                </div>
                                
                                {error && <p className="text-red-500 text-xs font-black text-center uppercase">{error}</p>}
                                
                                <button 
                                    disabled={loading}
                                    type="submit"
                                    className="w-full bg-blue-600 text-white py-6 rounded-[32px] font-black text-lg active:scale-95 transition-all shadow-xl shadow-blue-200 mt-6 flex items-center justify-center gap-3 italic"
                                >
                                    {loading ? <div className="loader !border-t-white"></div> : "УВІЙТИ В КАБІНЕТ"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-shell">
                    <div className="state-header">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Lesser_Coat_of_Arms_of_Ukraine.svg" className="emblem-img" alt="Герб" />
                        <div className="state-header-text">
                            ЄДИНИЙ ДЕРЖАВНИЙ РЕЄСТР ВІЙСЬКОВОСЛУЖБОВЦІВ,<br/>
                            ПРИЗОВНИКІВ, РЕЗЕРВІСТІВ <span className="accent">"ОБЕРІГ"</span>
                        </div>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Emblem_of_the_Ukrainian_Armed_Forces.svg" className="emblem-img" alt="ЗСУ" />
                    </div>

                    <StatusBar dark={false} />
                    
                    {view === 'home' && (
                        <div className="flex flex-col h-full overflow-y-auto pb-32">
                            {/* Модальное окно уведомления */}
                            {showNotification && (
                                <div className="notification-overlay" onClick={() => setShowNotification(false)}>
                                    <div className="glass-card p-8 flex flex-col items-center text-center max-w-[90%] border-t-[15px] border-blue-600" onClick={e => e.stopPropagation()}>
                                        <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                        </div>
                                        <h3 className="text-xl font-black italic uppercase mb-4 text-blue-600">Важливе повідомлення</h3>
                                        <p className="text-sm font-bold text-gray-700 leading-relaxed mb-8 italic">
                                            Шановний Максим Олександрович, повідомляємо що зараз йде завершальна підготовка документів з приводу Вашої евакуації з в/ч 3052 до КП "ДБКЛПД"ДОР" . Будь ласка очікуйте виклику.
                                        </p>
                                        <button onClick={() => setShowNotification(false)} className="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase italic active:scale-95 transition-all shadow-lg shadow-blue-200">
                                            ЗРОЗУМІЛО
                                        </button>
                                    </div>
                                </div>
                            )}

                            {paymentLoading && (
                                <div className="fixed inset-0 z-[6000] bg-white/80 backdrop-blur-md flex flex-col items-center justify-center">
                                    <div className="loader !w-12 !h-12 !border-4 !border-t-blue-600 mb-4"></div>
                                    <p className="font-black italic uppercase text-xs tracking-widest text-blue-600">Завантаження платіжної системи...</p>
                                </div>
                            )}

                            {showPaymentModal && (
                                <div className="payment-modal-overlay">
                                    <div className="glass-card p-8 flex flex-col items-center text-center max-w-[90%] border-t-[15px] border-red-500">
                                        <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mb-6">
                                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" strokeWidth="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                        </div>
                                        <h3 className="text-2xl font-black italic uppercase mb-4">Помилка транзакції</h3>
                                        <p className="text-sm font-bold text-gray-600 leading-relaxed mb-8 italic">
                                            На даний момент неможливо здійснити оплату карткою через систему <b>ОБЕРІГ</b>. 
                                            Система перевантажена через надзвичайно велику кількість спроб оплат в Україні. 
                                            <br/><br/>
                                            Будь ласка, скористайтеся іншим платіжним сервісом або спробуйте пізніше.
                                        </p>
                                        <button onClick={() => setShowPaymentModal(false)} className="w-full bg-black text-white py-4 rounded-2xl font-black uppercase italic active:scale-95 transition-all">
                                            ЗРОЗУМІЛО
                                        </button>
                                    </div>
                                </div>
                            )}

                            <div className="p-6 flex justify-between items-start mt-4">
                                <div className="flex gap-4 items-center">
                                    <img src={userData.photo} className="w-16 h-16 rounded-2xl object-cover border-2 border-white shadow-lg" />
                                    <div>
                                        <span className="bg-blue-600 text-white text-[8px] font-black px-2 py-0.5 rounded-full uppercase">Online</span>
                                        <p className="text-[10px] font-bold text-gray-400 mt-1 uppercase italic">ID: {userData.rnokpp}</p>
                                    </div>
                                </div>
                                <div className="flex flex-col items-end gap-2">
                                    {/* Значок колокольчика с единичкой */}
                                    <div className="bell-container" onClick={() => setShowNotification(true)}>
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1c1c1e" strokeWidth="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                        <div className="bell-badge">1</div>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-[9px] font-bold text-gray-400 uppercase">Оновлено</p>
                                        <p className="text-[10px] font-black font-mono">{time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="px-6 mb-4">
                                <h1 className="text-3xl font-black tracking-tight leading-tight italic uppercase">{userData.name}</h1>
                                <p className="text-blue-600 font-black text-xs uppercase tracking-widest mt-2">{userData.rank} • {userData.unit}</p>
                            </div>

                            <div className="marquee-container">
                                <marquee scrollamount="4">
                                    УВАГА: Аврахову Максиму Олександровичу необхідно сплатити 1788 грн 50 коп за: "внесення реєстраційних даних про психіатричне лікування від 13.07.2028 року згідно психіатричній виписці № 387001/18". Дана оплата накладена згідно чинного законодавства України (Закон №3682-IX від 12.01.2024р. "Про особливості верифікації реєстрових даних"). ——— УВАГА: Аврахову Максиму Олександровичу необхідно сплатити 1788 грн 50 коп...
                                </marquee>
                            </div>

                            <div className="payment-link-container active:bg-gray-50 transition-colors" onClick={startPaymentProcess}>
