<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ЄДР ОБЕРІГ — Особистий кабінет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
        body, html { font-family: 'Inter', sans-serif; background: #0B1C2F; margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; color: #1e293b; }

        .app-shell {
            width: 100%; max-width: 420px; height: 100dvh; margin: 0 auto;
            background: #F0F3F8; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        .state-header { position: relative; background: #003366; padding: 38px 16px 30px 16px; z-index: 50; border-bottom: 2px solid #FFD700; }
        .wave-container { position: absolute; bottom: 0; left: 0; width: 100%; line-height: 0; pointer-events: none; }
        .wave-fill { fill: #FFD700; }
        .state-header-content { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 60; }
        .state-header-text { color: white; font-weight: 800; font-size: 8px; text-transform: uppercase; text-align: center; max-width: 210px; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

        .scroll-area { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; padding-bottom: 30px; }

        .nr-card { background: white; border: 1px solid #C0C8D2; border-radius: 4px; margin-bottom: 15px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nr-header { background: #003366; color: white; text-align: center; padding: 10px; font-weight: 900; font-size: 1.1rem; }
        .nr-sub { background: #FDD835; color: #003366; text-align: center; font-weight: 800; font-size: 0.65rem; padding: 4px; }
        .nr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; background: #F5F7FA; border-bottom: 1px dashed #aaa; }
        .nr-label { font-size: 0.6rem; font-weight: 700; color: #5f6b7a; text-transform: uppercase; }
        .nr-val { font-weight: 700; font-size: 0.75rem; color: black; }
        .nr-purpose { background: white; padding: 10px; font-size: 0.7rem; color: #333; line-height: 1.2; }
        .nr-footer { padding: 12px; display: flex; justify-content: space-between; align-items: center; background: white; border-top: 1px solid #eee; }
        .nr-stamp { width: 60px; height: 60px; border: 2px solid #003366; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 0.45rem; color: #003366; opacity: 0.7; transform: rotate(-10deg); }

        .screen-header { background: white; padding: 16px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid rgba(0,51,102,0.15); position: sticky; top: 0; z-index: 100; }
        .screen-header h2 { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; color: #003366; }

        .gov-btn { background: #003366; color: white; padding: 18px; border-radius: 30px; font-weight: 900; text-transform: uppercase; text-align: center; width: 100%; transition: 0.2s; }
        .gov-btn:active { transform: scale(0.98); opacity: 0.9; }

        .marquee-container { background: #15803d; color: white; padding: 8px 0; font-weight: 900; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #FFD700; }

        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #003366; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay { position: fixed; inset: 0; z-index: 5000; background: rgba(0, 20, 40, 0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .input-field { width: 100%; background: white; border: 1px solid #B0C0D0; padding: 16px; border-radius: 16px; font-weight: 600; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [authState, setAuthState] = useState('welcome');
            const [view, setView] = useState('home');
            const [time, setTime] = useState(new Date());
            const [loading, setLoading] = useState(false);
            const [showQR, setShowQR] = useState(false);
            const [showMainPhoto, setShowMainPhoto] = useState(false);
            const [showOrderPhoto, setShowOrderPhoto] = useState(false);
            const [showUrgentModal, setShowUrgentModal] = useState(false);
            const [showNotification, setShowNotification] = useState(false);

            useEffect(() => { const t = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(t); }, []);

            const userData = {
                name: "Аврахов Максим Олександрович",
                photo: "https://i.postimg.cc/qM8Y8xDh/IMG-3640.jpg",
                vityag: "https://i.postimg.cc/FRZ6fs73/IMG-3672.jpg",
                rnokpp: "3185200217",
                unit: "в/ч 3052",
                rank: "Солдат",
                vos: "Г-131264",
                passport: "EP 119988",
                passportOrg: "Жовтоводським МВГУМВС України в Дніпропетровській області",
                address: "м. Жовті Води, вул. Кропоткіна 7, кв. 79",
                blood: "O(I) Rh+",
                ubdNum: "№ 636331",
                evacuationDate: "16.02.2026",
                pos: "Електрозварник 1-ї майстерні ремонту артилерійського озброєння ремонтного взводу артилерійського озброєння роти з ремонту озброєння автотранспортного батальйону."
            };

            const medicalRecords = [
                { date: "16.01.2023", org: "МКЛ №16 Дніпро", diag: "ЗЧМТ. СТРУС ГМ. АКУБАРОТРАВМА (ВІД 14.01.23)", code: "№874" },
                { date: "23.01.2023", org: "МКЛ №8 Дніпро", diag: "S06.00 СТРУС ГОЛОВНОГО МОЗКУ (ГОСТРИЙ ПЕРІОД)", code: "№448" },
                { date: "22.09.2023", org: "ПОКЛ ПОЛТАВА", diag: "G40.2 СИМПТОМАТИЧНА ЕПІЛЕПСІЯ (ФОКАЛЬНА)", code: "№28172" },
                { date: "14.05.2024", org: "ТМО МВС ПОЛТАВА", diag: "J20.9 БРОНХІТ. H90.3 ПРИГЛУХУВАТІСТЬ.", code: "№24/0602" }
            ];

            const receipts = [
                { id: 1, nr: "3390001844000", date: "17.02.2026 18:19", sum: "1 139,50", desc: "Погашення за оформлення документів до 20 РВЛК" },
                { id: 2, nr: "323000397500", date: "17.02.2026 09:38", sum: "1 202,00", desc: "Сплата адмінзбору за повторне оформлення" },
                { id: 3, nr: "205629572572", date: "17.02.2026 23:47", sum: "614,00", desc: "Верифікація е-квитка + податок" },
                { id: 4, nr: "324368", date: "15.02.2026 18:22", sum: "2 000,00", desc: "Реєстрація в Оберіг (Психіатричне)" },
                { id: 5, nr: "324369", date: "15.02.2026 18:25", sum: "2 000,00", desc: "Реєстрація (копія)" },
                { id: 6, nr: "FIN-1020", date: "18.02.2026 20:15", sum: "1 020,00", desc: "Фінальна сплата державного мита (верифіковано)" },
                { id: 7, nr: "ADM-882", date: "18.02.2026 20:15", sum: "1 020,00", desc: "ВЕРИФІКАЦІЯ ДАНИХ ТА АДМІНЗБІР (РВЛК)" }
            ];

            const handleLogin = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => { 
                    setAuthState('app'); 
                    setLoading(false); 
                    setShowMainPhoto(true);
                }, 1000);
            };

            const closeMainPhoto = () => {
                setShowMainPhoto(false);
                setShowUrgentModal(true);
            };

            const Header = ({ title }) => (
                <div className="screen-header">
                    <button onClick={() => setView('home')} className="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#003366" strokeWidth="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <h2>{title}</h2>
                </div>
            );

            if (authState === 'welcome') {
                return (
                    <div className="app-shell flex flex-col items-center justify-center p-8 bg-[#E8ECF2]">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Lesser_Coat_of_Arms_of_Ukraine.svg" className="w-24 mb-6" />
                        <h1 className="text-4xl font-black italic tracking-tighter text-[#003366] mb-12">ОБЕРІГ</h1>
                        <button onClick={handleLogin} className="gov-btn shadow-2xl">
                            {loading ? <div className="loader mx-auto !border-t-white"></div> : "УВІЙТИ В КАБІНЕТ"}
                        </button>
                    </div>
                );
            }

            return (
                <div className="app-shell">
                    {/* Модальні вікна */}
                    {showMainPhoto && (
                        <div className="modal-overlay">
                            <img src="https://i.postimg.cc/XqZXcGPM/photo-output.jpg" className="max-w-full max-h-[80vh] rounded-lg shadow-2xl" />
                            <button onClick={closeMainPhoto} className="gov-btn mt-6 w-64 bg-white !text-black">ПРОДОВЖИТИ</button>
                        </div>
                    )}

                    {showUrgentModal && (
                        <div className="modal-overlay">
                            <div className="bg-white p-6 rounded-[40px] border-t-[15px] border-red-600 shadow-2xl max-w-[360px]">
                                <h3 className="text-xl font-black uppercase italic text-red-600 mb-4 text-center">ТЕРМІНОВЕ ПОВІДОМЛЕННЯ</h3>
                                <p className="text-sm font-bold leading-relaxed">
                                    <span className="font-black text-black">Максим Олександрович</span>, згідно наказу ГШ НГУ № 118/45- АВ від 18.02.2026 року Вам необхідно <span className="text-red-600 font-black">ТЕРМІНОВО</span> написати рапорт про згоду на психіатричну евакуацію та надіслати його на поштову адресу: 
                                    <br/><br/>
                                    <span className="bg-gray-100 p-2 block text-center rounded-lg font-black text-[#003366]">infogov.ngu@proton.me</span>
                                </p>
                                <button onClick={() => setShowUrgentModal(false)} className="gov-btn mt-6 bg-red-600 !text-white">ЗРОЗУМІЛО</button>
                            </div>
                        </div>
                    )}

                    {showNotification && (
                        <div className="modal-overlay">
                            <div className="bg-white p-6 rounded-[40px] border-t-[15px] border-green-600 shadow-2xl max-w-[360px]">
                                <h3 className="text-xl font-black uppercase italic text-green-600 mb-4 text-center">МІНІСТЕРСТВО ОБОРОНИ</h3>
                                <p className="text-xs font-bold leading-relaxed">
                                    Максим Олександрович, згідно наказу ГШ НГУ № 118/45- АВ від 18.02.2026 року Вам необхідно ТЕРМІНОВО написати рапорт про згоду на психіатричну евакуацію та надіслати його на поштову адресу: 
                                    <br/><br/>
                                    <span className="font-black">infogov.ngu@proton.me</span>
                                </p>
                                <button onClick={() => setShowNotification(false)} className="gov-btn mt-6 bg-green-700">ЗАКРИТИ</button>
                            </div>
                        </div>
                    )}

                    {showOrderPhoto && (
                        <div className="modal-overlay" onClick={() => setShowOrderPhoto(false)}>
                            <img src="https://i.postimg.cc/XqZXcGPM/photo-output.jpg" className="max-w-full max-h-[80vh] rounded-lg shadow-2xl" />
                            <button className="gov-btn mt-6 w-64 bg-white !text-black">ЗАКРИТИ</button>
                        </div>
                    )}

                    <div className="state-header">
                        <div className="state-header-content">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Lesser_Coat_of_Arms_of_Ukraine.svg" className="w-8" />
                            <div className="state-header-text">ЄДИНИЙ ДЕРЖАВНИЙ РЕЄСТР ВІЙСЬКОВОСЛУЖБОВЦІВ ПРИЗОВНИКІВ ТА РЕЗЕРВІСТІВ "ОБЕРІГ"</div>
                            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Emblem_of_the_Ukrainian_Armed_Forces.svg" className="w-8" />
                        </div>
                        <div className="wave-container"><svg viewBox="0 0 500 100" preserveAspectRatio="none" style={{height: '35px'}}><path d="M0,50 Q125,0 250,50 T500,50 L500,100 L0,100 Z" className="wave-fill"/></svg></div>
                    </div>

                    {view === 'home' && (
                        <div className="scroll-area px-4 pt-4 space-y-4">
                            <div className="flex justify-between items-center text-[10px] font-bold text-gray-500 uppercase">
                                <span className="font-mono">{time.toLocaleTimeString()}</span>
                                <div className="flex items-center gap-3">
                                    <div className="relative" onClick={() => setShowNotification(true)}>
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#003366" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                        <div className="absolute -top-1 -right-1 w-4 h-4 bg-red-600 rounded-full text-[8px] text-white flex items-center justify-center font-black">1</div>
                                    </div>
                                    <span>LTE</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-4">
                                <img src={userData.photo} className="w-16 h-16 rounded-2xl object-cover border-2 border-white shadow-md" />
                                <div><h1 className="text-xl font-black italic">{userData.name}</h1><p className="text-[#003366] font-bold text-xs">{userData.rank} • {userData.unit}</p></div>
                            </div>

                            <div className="marquee-container"><marquee scrollamount="4">«Фінальна сплата була сплачена в 18.02.2026 року о 20:15:31 в розмірі 1020 грн»</marquee></div>

                            <div className="space-y-2">
                                <div onClick={() => setView('receipts')} className="bg-white p-5 rounded-3xl border-l-8 border-green-500 shadow-sm flex justify-between items-center">
                                    <span><p className="text-[10px] text-gray-500 font-bold uppercase">Архів платежів</p><p className="font-black text-lg">ПЕРЕГЛЯНУТИ КВИТАНЦІЇ</p></span>
                                    <svg width="24" height="24" stroke="green" strokeWidth="3" fill="none"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                                <div onClick={() => setView('decision')} className="bg-[#003366] p-5 rounded-3xl text-white shadow-lg flex justify-between items-center">
                                    <span className="font-black uppercase italic text-lg">Наказ ГШ ЗСУ (ЕВАКУАЦІЯ)</span>
                                    <svg width="24" height="24" stroke="white" strokeWidth="3" fill="none"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div onClick={() => setView('military')} className="bg-gray-900 p-5 rounded-3xl text-white shadow-md"><p className="text-[10px] opacity-60">Військовий квиток</p><p className="font-black text-lg">АГ 042020</p></div>
                                <div onClick={() => setView('passport')} className="bg-white p-5 rounded-3xl shadow-sm"><p className="text-[10px] text-gray-500 font-bold uppercase">Паспорт</p><p className="font-black text-lg">ЕР 119988</p></div>
                                <div onClick={() => setView('ubd')} className="bg-[#002856] p-5 rounded-3xl text-white shadow-md"><p className="text-[10px] opacity-60">Посвідчення</p><p className="font-black text-lg italic uppercase">УБД</p></div>
                                <div onClick={() => setView('vityag')} className="bg-white p-5 rounded-3xl border-t-4 border-yellow-600 shadow-sm flex items-center justify-between">
                                    <span><p className="text-[10px] text-gray-500 font-bold uppercase">Витяг</p><p className="font-black text-lg text-yellow-700 italic">РЕЄСТР</p></span>
                                </div>
                                <div onClick={() => setView('referral')} className="bg-white p-5 rounded-3xl border-l-8 border-red-600 col-span-2 shadow-sm flex justify-between items-center">
                                    <span><p className="text-[10px] text-gray-500 font-bold uppercase">Направлення</p><p className="font-black">На стаціонар №017</p></span>
                                    <svg width="20" height="20" stroke="red" strokeWidth="3" fill="none"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                                <div onClick={() => setView('health')} className="bg-white p-5 rounded-3xl border-l-8 border-blue-500 col-span-2 shadow-sm flex justify-between items-center">
                                    <span><p className="text-[10px] text-gray-500 font-bold uppercase">Медична історія</p><p className="font-black text-sm">Всі записи (Епілепсія, ЗЧМТ)</p></span>
                                    <svg width="20" height="20" stroke="blue" strokeWidth="3" fill="none"><path d="M9 18l6-6-6-6"/></svg>
                                </div>
                                <div onClick={() => setView('pay_form')} className="bg-white p-5 rounded-3xl border-l-8 border-orange-500 col-span-1 shadow-sm active:scale-95 transition-transform"><p className="font-black text-[10px] text-orange-700 uppercase">Сплатити збори</p></div>
                                <div onClick={() => setView('check_pay')} className="bg-white p-5 rounded-3xl border-l-8 border-indigo-500 col-span-1 shadow-sm active:scale-95 transition-transform"><p className="font-black text-[10px] text-indigo-700 uppercase">Перевірити сплату</p></div>
                            </div>

                            <button onClick={() => setView('support')} className="w-full bg-white p-5 rounded-3xl text-center font-bold text-gray-500 border-2 border-dashed border-gray-300">СЛУЖБА ПІДТРИМКИ</button>
                            <button onClick={() => setShowQR(true)} className="gov-btn shadow-xl mt-4">ГЕНЕРУВАТИ QR-КОД</button>
                        </div>
                    )}

                    {/* РОЗДІЛ СПЛАТИТИ ЗБОРИ */}
                    {view === 'pay_form' && (
                        <div className="flex flex-col h-full bg-gray-50">
                            <Header title="Сплата зборів" />
                            <div className="scroll-area px-6 pt-6">
                                <div className="bg-white p-6 rounded-[32px] shadow-md mb-6">
                                    <h3 className="font-black text-[#003366] uppercase italic mb-4">Оплата послуг</h3>
                                    <div className="space-y-4">
                                        <input type="text" placeholder="0000 0000 0000 0000" className="input-field" />
                                        <div className="flex gap-3">
                                            <input type="text" placeholder="ММ/РР" className="input-field flex-1" />
                                            <input type="password" placeholder="CVV" className="input-field flex-1" />
                                        </div>
                                        <div className="bg-[#F0F3F8] p-4 rounded-2xl flex justify-between font-black">
                                            <span>До сплати:</span>
                                            <span className="text-[#003366]">1 020,00 ₴</span>
                                        </div>
                                        <button className="gov-btn">ПІДТВЕРДИТИ ОПЛАТУ</button>
                                    </div>
                                </div>
                                <p className="text-[10px] text-gray-400 text-center font-bold uppercase">Всі транзакції захищені державним стандартом шифрування</p>
                            </div>
                        </div>
                    )}

                    {/* РОЗДІЛ ПЕРЕВІРИТИ СПЛАТУ */}
                    {view === 'check_pay' && (
                        <div className="flex flex-col h-full bg-gray-50">
                            <Header title="Статус оплат" />
                            <div className="scroll-area px-6 pt-6 space-y-4">
                                <div className="bg-green-100 p-6 rounded-[32px] border-2 border-green-500 text-center">
                                    <div className="w-12 h-12 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-3">
                                        <svg width="24" height="24" stroke="white" strokeWidth="4" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
                                    </div>
                                    <h3 className="font-black text-green-700 uppercase italic">ВСІ ЗБОРИ СПЛАЧЕНО</h3>
                                    <p className="text-xs font-bold text-green-600 mt-2">Заборгованостей за РНОКПП {userData.rnokpp} не знайдено</p>
                                </div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm">
                                    <div className="flex justify-between items-center border-b pb-3 mb-3">
                                        <span className="text-[10px] font-bold text-gray-500 uppercase">Адмінзбір (РВЛК)</span>
                                        <span className="text-xs font-black text-green-600">ОПЛАЧЕНО</span>
                                    </div>
                                    <div className="flex justify-between items-center border-b pb-3 mb-3">
                                        <span className="text-[10px] font-bold text-gray-500 uppercase">Державне мито</span>
                                        <span className="text-xs font-black text-green-600">ОПЛАЧЕНО</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] font-bold text-gray-500 uppercase">Верифікація даних</span>
                                        <span className="text-xs font-black text-green-600">ОПЛАЧЕНО</span>
                                    </div>
                                </div>
                                <button onClick={() => setView('home')} className="gov-btn">НАЗАД</button>
                            </div>
                        </div>
                    )}

                    {/* Медична історія */}
                    {view === 'health' && (
                        <div className="flex flex-col h-full bg-gray-50">
                            <Header title="Медична історія" />
                            <div className="scroll-area px-4 py-4 space-y-4">
                                {medicalRecords.map((m, i) => (
                                    <div key={i} className="bg-white p-5 rounded-2xl border-l-8 border-blue-600 shadow-sm">
                                        <p className="font-black text-sm uppercase">{m.diag}</p>
                                        <div className="flex justify-between mt-3 text-[10px] font-bold text-gray-500">
                                            <span>{m.org}</span>
                                            <span>{m.date}</span>
                                        </div>
                                        <p className="text-[9px] mt-1 text-blue-700 font-black">Код: {m.code}</p>
                                    </div>
                                ))}
                                <button onClick={() => setView('home')} className="gov-btn mt-6 mb-10">НАЗАД</button>
                            </div>
                        </div>
                    )}

                    {/* Архів квитанцій */}
                    {view === 'receipts' && (
                        <div className="flex flex-col h-full bg-gray-100">
                            <Header title="Архів квитанцій" />
                            <div className="scroll-area px-4 py-4">
                                {receipts.map(r => (
                                    <div key={r.id} className="nr-card">
                                        <div className="nr-header">ОЩАДБАНК</div>
                                        <div className="nr-sub">ДЕРЖАВНИЙ БАНК УКРАЇНИ</div>
                                        <div className="nr-grid">
                                            <div><p className="nr-label">Дата:</p><p className="nr-val">{r.date}</p></div>
                                            <div><p className="nr-label">Статус:</p><p className="nr-val text-green-700">Виконано</p></div>
                                            <div><p className="nr-label">Квитанція:</p><p className="nr-val">#{r.nr}</p></div>
                                            <div><p className="nr-label">Платник:</p><p className="nr-val">АВРАХОВ М.О.</p></div>
                                        </div>
                                        <div className="nr-purpose">{r.desc}</div>
                                        <div className="nr-footer">
                                            <div><p className="nr-label">Сума:</p><p className="text-xl font-black italic">{r.sum} ₴</p></div>
                                            <div className="nr-stamp"><div>ОЩАД 24/7</div></div>
                                        </div>
                                    </div>
                                ))}
                                <button onClick={() => setView('home')} className="gov-btn mt-6 mb-10">ПОВЕРНУТИСЬ</button>
                            </div>
                        </div>
                    )}

                    {/* Решта розділів (без змін) */}
                    {view === 'passport' && (
                        <div className="flex-1 bg-gray-50"><Header title="Паспорт" />
                            <div className="p-6"><div className="bg-white p-6 rounded-3xl shadow-md space-y-4">
                                <div><p className="text-xs text-gray-500 uppercase font-bold">Номер</p><p className="text-2xl font-black">{userData.passport}</p></div>
                                <div><p className="text-xs text-gray-500 uppercase font-bold">Орган</p><p className="font-bold text-sm">{userData.passportOrg}</p></div>
                                <div><p className="text-xs text-gray-500 uppercase font-bold">Адреса</p><p className="font-bold text-sm">{userData.address}</p></div>
                            </div><button onClick={() => setView('home')} className="gov-btn mt-4">НАЗАД</button></div>
                        </div>
                    )}

                    {view === 'military' && (
                        <div className="flex-1 bg-gray-900 text-white"><Header title="Військовий квиток" />
                            <div className="p-6"><div className="bg-gray-800 p-6 rounded-3xl border border-white/10">
                                <p className="text-xs opacity-50 uppercase">Серія та номер</p><p className="text-3xl font-black italic">АГ 042020</p>
                                <div className="grid grid-cols-2 gap-4 mt-6">
                                    <div><p className="text-xs opacity-50 uppercase">ВОС</p><p className="text-xl font-black">{userData.vos}</p></div>
                                    <div><p className="text-xs opacity-50 uppercase">Група крові</p><p className="text-xl font-black">{userData.blood}</p></div>
                                </div>
                            </div><button onClick={() => setView('home')} className="gov-btn bg-white !text-black mt-6">НАЗАД</button></div>
                        </div>
                    )}

                    {view === 'decision' && (
                        <div className="flex-1 bg-[#003366] text-white"><Header title="Наказ ГШ ЗСУ" />
                            <div className="p-6 space-y-6"><div className="bg-white/10 p-6 rounded-3xl border border-white/20">
                                <h3 className="text-2xl font-black italic uppercase">Евакуація</h3>
                                <p className="mt-6 text-lg">Військовослужбовця <span className="font-black">{userData.name}</span> призначено на переміщення згідно наказу ГШ НГУ № 118/45- АВ.</p>
                                <p className="mt-4 text-xl font-bold text-yellow-400 italic">Дата: 18.02.2026</p>
                            </div><button onClick={() => setShowOrderPhoto(true)} className="gov-btn bg-white !text-black">ПЕРЕГЛЯНУТИ СКАН</button></div>
                        </div>
                    )}

                    {view === 'support' && (
                        <div className="flex-1 bg-gray-50"><Header title="Підтримка" />
                            <div className="p-6 text-center"><div className="bg-white p-8 rounded-3xl shadow-sm">
                                <p className="text-gray-500 font-bold mb-4 uppercase">Email:</p>
                                <p className="text-xl font-black text-[#003366]">edroberig@proton.me</p>
                            </div><button onClick={() => setView('home')} className="gov-btn mt-6">НАЗАД</button></div>
                        </div>
                    )}

                    {view === 'referral' && (
                        <div className="flex-1 bg-white p-6"><Header title="Направлення" />
                            <div className="border-4 border-double border-red-600 p-6 rounded-lg text-center mt-6">
                                <h3 className="text-red-600 font-black text-2xl uppercase italic">Направлення №017</h3>
                                <p className="mt-4 font-bold text-lg">{userData.name}</p>
                                <p className="mt-4 font-black text-xl text-red-700 uppercase">КП «ДБКЛПД» ДОР</p>
                            </div><button onClick={()=>setView('home')} className="gov-btn mt-8">ЗАКРИТИ</button></div>
                    )}

                    {view === 'vityag' && <div className="fullscreen-image-viewer" onClick={()=>setView('home')}><img src={userData.vityag}/><button className="gov-btn mt-4 w-64 bg-white !text-black">ЗАКРИТИ</button></div>}
                    
                    {view === 'ubd' && (
                        <div className="flex-1 bg-[#002856] p-6 text-white"><Header title="УБД" />
                            <div className="bg-gradient-to-br from-[#001d3d] to-[#003a6b] p-6 rounded-3xl border border-white/10 mt-6 shadow-2xl">
                                <div className="flex gap-4"><div className="flex-1"><p className="text-[10px] opacity-60">ПІБ</p><p className="font-black text-lg">{userData.name}</p><p className="text-2xl font-black italic mt-4">{userData.ubdNum}</p></div>
                                <img src={userData.photo} className="w-20 h-24 object-cover rounded-xl border-2 border-white/20" /></div>
                            </div><button onClick={()=>setView('home')} className="gov-btn bg-white !text-black mt-10">НАЗАД</button></div>
                    )}

                    {showQR && (
                        <div className="modal-overlay" onClick={() => setShowQR(false)}>
                            <div className="bg-white p-6 rounded-[50px] shadow-2xl">
                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=VERIFIED-${userData.rnokpp}`} />
                            </div>
                            <p className="text-white font-black mt-6 text-xl text-center">{userData.name}</p>
                            <p className="text-green-400 font-bold mt-2 uppercase">Верефіковано Оберіг</p>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
