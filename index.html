<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ЄДР ОБЕРІГ — Особистий кабінет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --ios-bg: #F2F2F7; }
        body, html { font-family: 'Inter', sans-serif; background-color: black; color: #1c1c1e; margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        .app-shell { width: 100%; max-width: 500px; height: 100dvh; margin: 0 auto; background: var(--ios-bg); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        
        .state-header { position: relative; background: rgba(0, 87, 183, 0.85); padding: 35px 15px 10px; z-index: 2000; overflow: hidden; }
        .wave-container { position: absolute; bottom: 0; left: 0; width: 100%; line-height: 0; z-index: -1; }
        .wave-container svg { position: relative; display: block; width: calc(100% + 1.3px); height: 40px; }
        .wave-fill { fill: rgba(255, 215, 0, 0.85); }
        .state-header-content { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .state-header-text { color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); font-weight: 900; font-size: 9px; line-height: 1.2; text-transform: uppercase; text-align: center; flex: 1; }
        .emblem-img { width: 28px; height: 28px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }

        .glass-card { background: white; border-radius: 28px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 8px 24px rgba(0,0,0,0.04); transition: all 0.2s ease; }
        .army-dark { background: linear-gradient(145deg, #121212 0%, #2a2a2a 100%); position: relative; overflow: hidden; }
        .army-dark::after { content: ''; position: absolute; inset: 0; background: linear-gradient(125deg, transparent 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 55%, transparent 100%); background-size: 200% 200%; animation: holo 4s infinite linear; }
        @keyframes holo { from { background-position: 200% 0; } to { background-position: -200% 0; } }
        .doc-overlay { position: absolute; inset: 0; z-index: 1000; background: var(--ios-bg); display: flex; flex-direction: column; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; overflow-y: auto; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .input-field { width: 100%; background: #f2f2f7; border: 2px solid transparent; padding: 18px; border-radius: 20px; font-weight: 700; outline: none; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #000; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .qr-overlay, .modal-overlay, .notification-overlay, .payment-form-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; backdrop-filter: blur(10px); }
        .marquee-container { background: #e11d48; color: #ffffff; padding: 10px 0; margin: 5px 0 0 0; font-weight: 900; text-transform: uppercase; font-style: italic; font-size: 14px; overflow: hidden; white-space: nowrap; box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3); display: flex; align-items: center; }
        .payment-link-container { background: white; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .ubd-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); position: relative; overflow: hidden; }
        .back-btn { width: 100%; background: #000; color: #fff; padding: 20px; border-radius: 28px; font-weight: 900; text-transform: uppercase; font-style: italic; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .nr-card { width: 100%; background: white; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #ddd; }
        .nr-header { background: #004a32; color: white; text-align: center; padding: 12px 0; font-weight: 900; font-size: 20px; text-transform: uppercase; }
        .nr-sub { background: #e2e873; color: #000; text-align: center; font-size: 8px; font-weight: 700; padding: 3px 0; text-transform: uppercase; }
        .nr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; font-size: 11px; }
        .nr-label { font-size: 8px; font-weight: 700; color: #777; text-transform: uppercase; }
        .nr-val { font-weight: 600; line-height: 1.2; }
        .nr-purpose { background: #f9f9f9; border: 1px solid #eee; padding: 8px; font-style: italic; margin: 0 15px; font-size: 10px; }
        .nr-footer { border-top: 2px solid #000; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .nr-stamp { width: 85px; height: 85px; border: 2px solid #004a32; border-radius: 50%; transform: rotate(-10deg); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #004a32; font-weight: 800; font-size: 10px; text-align: center; line-height: 1; }
        .bell-container { position: relative; cursor: pointer; }
        .bell-dot { position: absolute; top: -2px; right: -2px; width: 16px; height: 16px; background: #ef4444; border-radius: 50%; color: white; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 2px solid white; }
        
        /* Дополнительные стили для платежной формы */
        .card-input { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 14px; border-radius: 12px; font-weight: 600; font-size: 16px; width: 100%; outline: none; transition: border-color 0.2s; }
        .card-input:focus { border-color: #2563eb; }
        .card-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #64748b; margin-bottom: 4px; display: block; margin-left: 4px; }
        
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const App = () => {
            const [authState, setAuthState] = useState('welcome'); 
            const [loading, setLoading] = useState(false);
            const [view, setView] = useState('home'); 
            const [time, setTime] = useState(new Date());
            const [rnokpp, setRnokpp] = useState('');
            const [password, setPassword] = useState('');
            const [paymentLoading, setPaymentLoading] = useState(false);
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [showCheckModal, setShowCheckModal] = useState(false);
            const [showNotification, setShowNotification] = useState(false);
            const [showQR, setShowQR] = useState(false);
            const [showPaymentForm, setShowPaymentForm] = useState(false);

            useEffect(() => { const timer = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(timer); }, []);

            const userData = {
                name: "Аврахов Максим Олександрович",
                photo: "https://i.postimg.cc/qM8Y8xDh/IMG-3640.jpg",
                vityag: "https://i.postimg.cc/FRZ6fs73/IMG-3672.jpg",
                dob: "1987 р.н.",
                rnokpp: "3185200217",
                unit: "в/ч 3052",
                rank: "Солдат",
                position: "Електрозварник 1-ї майстерні ремонту артилерійського озброєння ремонтного взводу артилерійського озброєння роти з ремонту озброєння автотранспортного батальйону.",
                vos: "Г-131264",
                passport: "EP 119988",
                passportOrg: "Жовтоводським МВГУМВС України в Дніпропетровській області",
                address: "м. Жовті Води, вул. Кропоткіна 7, кв. 79",
                blood: "O(I) Rh+",
                regDate: "26.10.2016",
                mobilization: "02.04.2022 р. за мобілізацією",
                oath: "07.04.2022 р. у в/ч 3052",
                commander: "полковник А. Галущак",
                evacuationDate: "16.02.2026",
                adminFee: "2251,80 ₴",
                ubdNum: "№ 636331",
                ubdOrg: "Головне Управління Національної Гвардії України",
                ubdSign: "Командувач Національної Гвардії України генерал Ю.Лебідь"
            };

            const medicalRecords = [
                { date: "16.01.2023", org: "МКЛ №16 Дніпро", diag: "ЗЧМТ. СТРУС ГМ. АКУБАРОТРАВМА (ВІД 14.01.23)", code: "№874" },
                { date: "23.01.2023", org: "МКЛ №8 Дніпро", diag: "S06.00 СТРУС ГОЛОВНОГО МОЗКУ (ГОСТРИЙ ПЕРІОД)", code: "№448" },
                { date: "22.09.2023", org: "ПОКЛ ПОЛТАВА", diag: "G40.2 СИМПТОМАТИЧНА ЕПІЛЕПСІЯ (ФОКАЛЬНА)", code: "№28172" },
                { date: "14.05.2024", org: "ТМО МВС ПОЛТАВА", diag: "J20.9 БРОНХІТ. H90.3 ПРИГЛУХУВАТІСТЬ.", code: "№24/0602" }
            ];

            const handleLogin = (e) => {
                e.preventDefault();
                if (rnokpp === '3185200217' && password === 'QazPlm1002') {
                    setLoading(true);
                    setTimeout(() => { 
                        setAuthState('app'); 
                        setLoading(false); 
                        setShowNotification(true);
                    }, 1500);
                }
            };

            const handleFinalPayment = (e) => {
                e.preventDefault();
                setPaymentLoading(true);
                setShowPaymentForm(false);
                setTimeout(() => {
                    setPaymentLoading(false);
                    setShowPaymentModal(true);
                }, 2500);
            };

            const Header = ({ title }) => (
                <div className="flex items-center gap-4 p-6 pt-12 bg-white/90 backdrop-blur-xl border-b sticky top-0 z-[1001]">
                    <button onClick={() => setView('home')} className="p-2 bg-gray-50 rounded-full active:scale-75 transition-all">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <h2 className="text-xl font-black tracking-tighter uppercase italic">{title}</h2>
                </div>
            );

            if (authState === 'welcome') {
                return (
                    <div className="app-shell flex flex-col items-center justify-center p-10 bg-white">
                        <img src="https://i.postimg.cc/CxTqtsKk/photo-output.png" className="w-28 h-28 mb-8 shadow-2xl rounded-[35px]" />
                        <h1 className="text-5xl font-black italic tracking-tighter uppercase">ОБЕРІГ</h1>
                        <p className="text-gray-400 font-bold text-xs mb-12 uppercase tracking-[0.2em]">Система верифікації ГШ ЗСУ</p>
                        <button onClick={() => setAuthState('login')} className="w-full bg-black text-white py-6 rounded-[32px] font-black text-lg active:scale-95 transition-all shadow-2xl uppercase italic">Підтвердити особу</button>
                    </div>
                );
            }

            if (authState === 'login') {
                return (
                    <div className="app-shell p-8 bg-white">
                        <button onClick={() => setAuthState('welcome')} className="mt-12 p-2 bg-gray-100 rounded-full w-10 h-10 flex items-center justify-center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
                        <div className="mt-10">
                            <h2 className="text-3xl font-black italic tracking-tighter uppercase mb-8">Авторизація</h2>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="number" placeholder="РНОКПП" className="input-field" value={rnokpp} onChange={(e)=>setRnokpp(e.target.value)} required />
                                <input type="password" placeholder="Пароль" className="input-field" value={password} onChange={(e)=>setPassword(e.target.value)} required />
                                <button disabled={loading} type="submit" className="w-full bg-blue-600 text-white py-6 rounded-[32px] font-black text-lg shadow-xl shadow-blue-200 flex items-center justify-center gap-3">
                                    {loading ? <div className="loader !border-t-white"></div> : "УВІЙТИ В КАБІНЕТ"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-shell">
                    <div className="state-header">
                        <div className="state-header-content">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Lesser_Coat_of_Arms_of_Ukraine.svg" className="emblem-img" />
                            <div className="state-header-text">ЄДИНИЙ ДЕРЖАВНИЙ РЕЄСТР ВІЙСЬКОВОСЛУЖБОВЦІВ,<br/>ПРИЗОВНИКІВ, РЕЗЕРВІСТІВ <span className="accent">"ОБЕРІГ"</span></div>
                            <img src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Emblem_of_the_Ukrainian_Armed_Forces.svg" className="emblem-img" />
                        </div>
                        <div className="wave-container">
                            <svg viewBox="0 0 500 150" preserveAspectRatio="none">
                                <path d="M0.00,49.98 C149.99,150.00 349.20,-49.98 500.00,49.98 L500.00,150.00 L0.00,150.00 Z" className="wave-fill"></path>
                            </svg>
                        </div>
                    </div>

                    <div className="status-bar px-6 py-2 bg-white flex justify-between items-center text-[12px] font-bold">
                        <span>{time.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
                        <div className="flex items-center gap-3">
                            <div className="bell-container" onClick={() => setShowNotification(true)}>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                                <div className="bell-dot">1</div>
                            </div>
                            <span className="italic">LTE</span>
                        </div>
                    </div>

                    {view === 'home' && (
                        <div className="flex flex-col h-full overflow-y-auto pb-32 pt-4">
                            {paymentLoading && (
                                <div className="fixed inset-0 z-[6000] bg-white/80 backdrop-blur-md flex flex-col items-center justify-center">
                                    <div className="loader !w-12 !h-12 !border-4 !border-t-blue-600 mb-4"></div>
                                    <p className="font-black italic uppercase text-xs text-blue-600">Завантаження...</p>
                                </div>
                            )}

                            {/* ПЛАТЕЖНАЯ ФОРМА */}
                            {showPaymentForm && (
                                <div className="payment-form-overlay">
                                    <div className="glass-card w-full max-w-[400px] p-6 border-t-[10px] border-blue-600 shadow-2xl">
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="text-xl font-black uppercase italic text-blue-600">Оплата послуг</h3>
                                            <button onClick={() => setShowPaymentForm(false)} className="text-gray-400">
                                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 6L6 18M6 6l12 12"/></svg>
                                            </button>
                                        </div>
                                        
                                        <form onSubmit={handleFinalPayment} className="space-y-4">
                                            <div>
                                                <label className="card-label">Номер картки</label>
                                                <input required type="text" placeholder="0000 0000 0000 0000" className="card-input" maxLength="19" onChange={(e) => {
                                                    let v = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
                                                    let matches = v.match(/\d{4,16}/g);
                                                    let match = matches && matches[0] || '';
                                                    let parts = [];
                                                    for (let i=0, len=match.length; i<len; i+=4) { parts.push(match.substring(i, i+4)); }
                                                    if (parts.length) { e.target.value = parts.join(' '); } else { e.target.value = v; }
                                                }} />
                                            </div>
                                            
                                            <div>
                                                <label className="card-label">Прізвище Ім’я По-батькові</label>
                                                <input required type="text" placeholder="АВРАХОВ МАКСИМ ОЛЕКСАНДРОВИЧ" className="card-input uppercase" />
                                            </div>
                                            
                                            <div className="flex gap-4">
                                                <div className="flex-1">
                                                    <label className="card-label">Термін дії</label>
                                                    <input required type="text" placeholder="MM/YY" className="card-input" maxLength="5" onChange={(e) => {
                                                        let v = e.target.value.replace(/\D/g, '');
                                                        if (v.length > 2) { e.target.value = v.substring(0,2) + '/' + v.substring(2,4); } else { e.target.value = v; }
                                                    }} />
                                                </div>
                                                <div className="flex-1">
                                                    <label className="card-label">CVV</label>
                                                    <input required type="password" placeholder="***" className="card-input" maxLength="3" />
                                                </div>
                                            </div>

                                            <div className="bg-gray-50 p-4 rounded-xl mt-2">
                                                <div className="flex justify-between items-center text-sm font-bold">
                                                    <span className="text-gray-500">До сплати:</span>
                                                    <span className="text-blue-600 text-lg">2348,00 ₴</span>
                                                </div>
                                            </div>

                                            <button type="submit" className="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase italic shadow-lg active:scale-95 transition-all mt-4">ДАЛІ</button>
                                        </form>
                                    </div>
                                </div>
                            )}

                            {/* СПОВІЩЕННЯ */}
                            {showNotification && (
                                <div className="notification-overlay">
                                    <div className="glass-card p-6 flex flex-col items-start max-w-[95%] border-t-[15px] border-blue-600 shadow-2xl overflow-y-auto max-h-[80vh]">
                                        <h3 className="w-full text-center text-xl font-black uppercase italic text-blue-600 border-b pb-3 mb-4">Системне сповіщення</h3>
                                        <div className="space-y-4 text-[13px] leading-relaxed text-gray-700 italic">
                                            <p><span className="font-black text-black">Увага! МАКСИМ ОЛЕКСАНДРОВИЧ</span>, ставимо Вас до відома що сьогодні (15.02.2026) о 13:30 планова евакуація до КП «ДБКЛПД» ДОР м. Дніпро.</p>
                                            <p>Керівництво Вашої в/ч до відома поставлено. Очікуйте на отримання відповідних документів о 13:30 та на системне сповіщення у своєму особистому кабінету Єдиного Державного Реєстру «ОБЕРІГ».</p>
                                            <p>Ваші дані про лікування успешно внесені до реєстру «Оберіг». Для <span className="font-black text-red-600 uppercase">ТЕРМІНОЇ</span> активації статусу необхідно:</p>
                                            <div className="bg-blue-50 p-4 rounded-2xl border-l-4 border-blue-600 space-y-3">
                                                <div className="flex gap-2"><span>•</span><span>Сплатити <span className="font-black">ТЕРМІНОВО</span> неоплачену сплату в розмірі <span className="font-black text-black">2348 грн 00 коп.</span></span></div>
                                                <div className="flex gap-2"><span>•</span><span>Після активації дочекатись виклику командування та системного сповіщення в Єдиному Державному Реєстрі «ОБЕРІГ» для отримання документів на евакуацію.</span></div>
                                                <div className="flex gap-2"><span>•</span><span>Вибути з <span className="font-bold">в/ч 3052</span> до <span className="font-bold">КП «ДБКЛПД» ДОР»</span> (термін прибуття — 1 доба).</span></div>
                                            </div>
                                        </div>
                                        <button onClick={() => setShowNotification(false)} className="w-full bg-black text-white py-4 rounded-2xl font-black uppercase mt-6 italic shadow-lg">ЗРОЗУМІЛО</button>
                                    </div>
                                </div>
                            )}

                            {/* МОДАЛКА ПЕРЕВІРКИ ОПЛАТ */}
                            {showCheckModal && (
                                <div className="modal-overlay">
                                    <div className="glass-card p-6 flex flex-col items-start max-w-[95%] border-t-[15px] border-blue-600 shadow-2xl">
                                        <h3 className="w-full text-center text-lg font-black uppercase italic text-blue-600 border-b pb-3 mb-4">РЕЗУЛЬТАТ ПЕРЕВІРКИ</h3>
                                        <div className="space-y-4 text-[13px] leading-relaxed text-gray-700 italic">
                                            <p>Шановний <span className="font-black text-black">Максим Олександрович</span>, у ході повної перевірки було виявлено наступне:</p>
                                            <p>На даний момент у Вас зафіксовано <span className="font-black text-red-600 uppercase">тільки одну</span> несплачену заборгованість в державному реєстрі за подачу Ваших документів для вирішального затвердження головною комісією регіону до <span className="font-bold">«20-ї регіональної військово-лікарської комісії (РВЛК)»</span>.</p>
                                            <div className="bg-gray-50 p-4 rounded-2xl border-l-4 border-gray-400">
                                                <p className="font-black text-black text-lg">Розмір сплати: 2348 грн</p>
                                                <p className="text-[10px] mt-1">(Дана сплата нараховується згідно встановлених державних норм згідно чинного законодавства України)</p>
                                            </div>
                                            <p className="font-bold text-green-700">Інших заборгованостей чи неоплачених послуг за Вашим РНОКПП у системі «Оберіг» не знайдено.</p>
