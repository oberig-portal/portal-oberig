<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Оберіг — Повний кабінет</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body, html { 
            font-family: 'Inter', sans-serif; 
            background-color: #F3F4F6; 
            color: #111827;
            margin: 0; padding: 0; 
            height: 100dvh; width: 100%;
            overflow: hidden;
        }

        .app-shell {
            width: 100%;
            max-width: 500px;
            height: 100dvh;
            margin: 0 auto;
            background: #F9FAFB;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
        }

        .diia-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .diia-gradient {
            background: linear-gradient(135deg, #000000 0%, #2d2d2d 100%);
        }

        .doc-overlay {
            position: absolute; inset: 0; z-index: 1000;
            background: white; display: flex; flex-direction: column;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .oschad-header-top { background: #004a33; color: white; padding: 12px; text-align: center; font-weight: 800; font-size: 16px; }
        .oschad-sub-yellow { background: #e6e969; color: #000; padding: 4px; text-align: center; font-size: 8px; font-weight: 900; }
        
        .qr-overlay {
            position: absolute; inset: 0; z-index: 2000;
            background: rgba(255,255,255,0.98);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .scan-line {
            position: absolute; width: 100%; height: 2px;
            background: #000; box-shadow: 0 0 15px #000;
            animation: scan 2s linear infinite;
        }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        * { user-select: none; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [view, setView] = useState('home'); 
            const [showQR, setShowQR] = useState(false);
            const [creds, setCreds] = useState({ id: '', pass: '' });

            const medicalData = [
                { id: '874', date: '16.01.2023', org: 'МКЛ №16 Дніпро', diag: 'ЗЧМТ. СТРУС ГМ. АКУБАРОТРАВМА' },
                { id: '448', date: '23.01.2023', org: 'МКЛ №8 Дніпро', diag: 'S06.00 СТРУС ГОЛОВНОГО МОЗКУ' },
                { id: '28172', date: '22.09.2023', org: 'ПОКЛ ПОЛТАВА', diag: 'G40.2 СИМПТОМАТИЧНА ЕПІЛЕПСІЯ' },
                { id: '24/0602', date: '14.05.2024', org: 'ТМО МВС ПОЛТАВА', diag: 'H90.3 ПРИГЛУХУВАТІСТЬ' }
            ];

            const handleLogin = (e) => {
                e.preventDefault();
                if (creds.id === '3185200217' && creds.pass === 'QazPlm1002') {
                    setIsAuth(true);
                } else {
                    alert("Невірні дані");
                }
            };

            const Header = ({ title }) => (
                <div className="flex items-center gap-4 p-6 pt-12 bg-white sticky top-0 z-50 border-b border-gray-50">
                    <button onClick={() => setView('home')} className="p-2 bg-gray-50 rounded-full">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </button>
                    <h2 className="text-xl font-extrabold tracking-tight">{title}</h2>
                </div>
            );

            if (!isAuth) {
                return (
                    <div className="app-shell flex items-center justify-center p-8">
                        <div className="w-full text-center">
                            <div className="w-20 h-20 bg-black rounded-3xl mx-auto mb-6 flex items-center justify-center">
                                <img src="https://i.postimg.cc/CxTqtsKk/photo-output.png" className="w-12 h-12 invert" />
                            </div>
                            <h1 className="text-4xl font-black tracking-tighter mb-10">ОБЕРІГ</h1>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="text" value={creds.id} onChange={e => setCreds({...creds, id: e.target.value})} className="w-full bg-white border border-gray-200 rounded-2xl p-5 font-bold" placeholder="РНОКПП" />
                                <input type="password" value={creds.pass} onChange={e => setCreds({...creds, pass: e.target.value})} className="w-full bg-white border border-gray-200 rounded-2xl p-5 font-bold" placeholder="Пароль" />
                                <button type="submit" className="w-full bg-black text-white py-5 rounded-2xl font-black uppercase shadow-xl">Вхід</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-shell">
                    {view === 'home' && (
                        <div className="flex flex-col h-full overflow-y-auto pb-32">
                            <div className="p-6 flex justify-between items-center">
                                <img src="https://i.postimg.cc/CxTqtsKk/photo-output.png" className="w-10 h-10" />
                                <span className="text-[10px] font-black text-gray-400">14.02.2026</span>
                            </div>

                            <div className="px-6 mb-8">
                                <h1 className="text-3xl font-black tracking-tight">Аврахов<br/>Максим Олександрович</h1>
                                <p className="text-blue-600 font-bold text-xs uppercase mt-2">Солдат • в/ч 3052 • 3185200217</p>
                            </div>

                            <div className="px-6 space-y-4">
                                {/* ОСНОВНИЙ ДОКУМЕНТ */}
                                <div className="diia-gradient p-6 rounded-[32px] text-white shadow-xl cursor-pointer" onClick={() => setView('military')}>
                                    <div className="flex justify-between items-start mb-8">
                                        <p className="text-[10px] font-bold opacity-60 uppercase">Військовий квиток</p>
                                        <p className="font-black">AГ 042020</p>
                                    </div>
                                    <p className="text-xs font-bold opacity-60 uppercase">Статус</p>
                                    <p className="text-lg font-black tracking-tight">ОЧІКУЄ ЕВАКУАЦІЇ</p>
                                </div>

                                {/* СПЛАЧЕНО */}
                                <div className="diia-card p-5 border-l-8 border-green-500 flex justify-between items-center" onClick={() => setView('new_receipt')}>
                                    <div>
                                        <p className="text-[10px] font-black text-gray-400 uppercase">Адмінзбір</p>
                                        <p className="font-black">СПЛАЧЕНО 2251.80 ₴</p>
                                    </div>
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>
                                </div>

                                {/* РІШЕННЯ */}
                                <div className="diia-card p-5 bg-blue-50 border-none cursor-pointer" onClick={() => setView('decision')}>
                                    <p className="text-[10px] font-black text-blue-400 uppercase">Рішення ГШ</p>
                                    <p className="font-black text-blue-900">ЕВАКУАЦІЯ: 16.02.2026</p>
                                </div>

                                {/* ПАПОРТ */}
                                <div className="diia-card p-5 flex justify-between items-center" onClick={() => setView('passport')}>
                                    <span className="font-black text-sm uppercase">Паспорт EP 119988</span>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="gray" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg>
                                </div>

                                {/* МЕДИЦИНА */}
                                <div className="diia-card p-5" onClick={() => setView('health')}>
                                    <p className="text-[10px] font-black text-red-400 uppercase mb-1">Медичний архів</p>
                                    <p className="text-sm font-bold">G40.2 Епілепсія, ЗЧМТ, Глухота</p>
                                </div>

                                {/* НАПРАВЛЕННЯ */}
                                <div className="diia-card p-5 border-l-8 border-red-600" onClick={() => setView('referral')}>
                                    <p className="text-[10px] font-black text-gray-400 uppercase">Направлення ВЛК</p>
                                    <p className="font-black">КП «ДБКЛПД» ДОР</p>
                                </div>
                            </div>

                            <div className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-gray-50 to-transparent">
                                <button onClick={() => setShowQR(true)} className="w-full max-w-sm mx-auto bg-black text-white py-5 rounded-[24px] font-black flex items-center justify-center gap-3 shadow-2xl">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 7h10v10H7z"/></svg>
                                    QR-КОД ДОКУМЕНТА
                                </button>
                            </div>
                        </div>
                    )}

                    {/* QR OVERLAY */}
                    {showQR && (
                        <div className="qr-overlay" onClick={() => setShowQR(false)}>
                            <div className="p-8 bg-white rounded-[40px] shadow-2xl relative overflow-hidden border border-gray-100">
                                <div className="scan-line"></div>
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=VERIFIED-ABRAKHOV-3185200217" className="w-64 h-64" />
                            </div>
                            <h3 className="mt-8 text-2xl font-black italic">Аврахов М.О.</h3>
                            <p className="text-gray-400 font-bold text-xs uppercase mt-2">Перевірено ПАК "ОБЕРІГ"</p>
                        </div>
                    )}

                    {/* ПАСПОРТ */}
                    {view === 'passport' && (
                        <div className="doc-overlay">
                            <Header title="Паспортні дані" />
                            <div className="p-6 space-y-4">
                                <div className="diia-card p-6 space-y-6">
                                    <div><p className="text-[10px] font-bold text-gray-400 uppercase">Серія та номер</p><p className="text-xl font-black">EP 119988</p></div>
                                    <div><p className="text-[10px] font-bold text-gray-400 uppercase">Виданий</p><p className="text-sm font-black uppercase">Жовтоводським МВГУМВС України в Дніпропетровській обл.</p></div>
                                    <div className="pt-4 border-t border-gray-50">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase">Реєстрація</p>
                                        <p className="text-sm font-black">м. Жовті Води, вул. Кропоткіна 7, кв. 79</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* МЕДИЦИНА */}
                    {view === 'health' && (
                        <div className="doc-overlay">
                            <Header title="Медична історія" />
                            <div className="p-6 space-y-4 overflow-y-auto">
                                {medicalData.map((m, i) => (
                                    <div key={i} className="diia-card p-5 border-l-4 border-blue-500">
                                        <div className="flex justify-between mb-2">
                                            <span className="text-[10px] font-black text-blue-500 uppercase">Запис №{m.id}</span>
                                            <span className="text-[10px] font-bold text-gray-400">{m.date}</span>
                                        </div>
                                        <p className="font-black text-sm uppercase">{m.diag}</p>
                                        <p className="text-[10px] font-bold text-gray-400 mt-2 uppercase">{m.org}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* КВИТАНЦІЯ З ФОТО */}
                    {view === 'new_receipt' && (
                        <div className="doc-overlay">
                            <div className="oschad-header-top">ОЩАДБАНК</div>
                            <div className="oschad-sub-yellow uppercase">Мій банк. Моя країна</div>
                            <div className="p-6 flex flex-col h-full">
                                <h3 className="text-center font-black text-base mt-2 mb-6 uppercase">НА IBAN З КАРТКОВОГО РАХУНКУ</h3>
                                <div className="space-y-3">
                                    <div className="flex justify-between border-b pb-1"><span className="text-[10px] font-bold text-gray-400 uppercase">Дата</span><span className="text-xs font-black">14.02.2026 18:09:14</span></div>
                                    <div className="flex justify-between border-b pb-1"><span className="text-[10px] font-bold text-gray-400 uppercase">Статус</span><span className="text-xs font-black text-green-700">Виконано успішно</span></div>
                                    <div className="flex justify-between border-b pb-1"><span className="text-[10px] font-bold text-gray-400 uppercase">Платник</span><span className="text-xs font-black uppercase">Ахременко Т.Г</span></div>
                                    <div className="flex justify-between border-b pb-1"><span className="text-[10px] font-bold text-gray-400 uppercase">Отримувач</span><span className="text-xs font-black uppercase">Міноборони України</span></div>
                                    <div className="bg-gray-50 p-4 rounded-xl text-[10px] font-bold leading-tight">
                                        Для закриття кадастрових реєстрів з приводу засідання комісії по утвердженню непридатності Аврахову М.О. ПАК "Оберіг". Код: 3185200217
                                    </div>
                                    <div className="pt-6 border-t-2 border-black">
                                        <div className="flex justify-between items-center"><span className="text-xs font-bold">Сума:</span><span className="text-xl font-black">2 251,80 ₴</span></div>
                                        <div className="flex justify-between items-end mt-2"><span className="text-sm font-black">РАЗОМ:</span><span className="text-4xl font-black tracking-tighter">2 251,80 ₴</span></div>
                                    </div>
                                </div>
                                <div className="mt-8 flex justify-end">
                                    <div className="w-24 h-24 border-4 border-slate-300 rounded-full flex flex-col items-center justify-center rotate-[-15deg] text-slate-400">
                                        <div className="text-[10px] font-black">ОЩАД 24/7</div>
                                        <div className="text-[6px] font-bold text-center">ВЕРИФІКОВАНО<br/>14.02.2026</div>
                                    </div>
                                </div>
                                <button onClick={() => setView('home')} className="w-full mt-auto bg-black text-white py-5 rounded-2xl font-black uppercase text-xs">Закрити</button>
                            </div>
                        </div>
                    )}

                    {/* НАПРАВЛЕННЯ */}
                    {view === 'referral' && (
                        <div className="doc-overlay">
                            <Header title="Направлення №017" />
                            <div className="p-6">
                                <div className="diia-card p-8 border-none bg-red-50">
                                    <p className="text-center text-[10px] font-black uppercase mb-4 text-red-900">Міністерство оборони України</p>
                                    <h2 className="text-xl font-black text-center mb-8 uppercase">Електронне направлення</h2>
                                    <div className="space-y-4 text-sm font-bold">
                                        <p>Військовослужбовцю: <br/><span className="font-black uppercase">Аврахов М. О.</span></p>
                                        <p>Направлення до: <br/><span className="font-black">КП «ДБКЛПД» ДОР</span></p>
                                        <p>Мета: <br/><span className="font-black text-red-700">Стаціонарне обстеження та ВЛК</span></p>
                                    </div>
                                    <div className="mt-10 pt-6 border-t border-red-200">
                                        <p className="text-[10px] font-black uppercase opacity-50">Підписано КЕП</p>
                                        <p className="font-black text-xs">полковник БАЙЦУРЕНКО А. Б.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* РІШЕННЯ */}
                    {view === 'decision' && (
                        <div className="doc-overlay">
                            <Header title="Рішення ГШ ЗСУ" />
                            <div className="p-6">
                                <div className="diia-card p-8 bg-blue-600 text-white shadow-xl">
                                    <p className="text-[10px] font-black uppercase opacity-60 mb-4">№ 874/SEC-2026</p>
                                    <h3 className="text-2xl font-black mb-6 leading-tight">НАКАЗ НА ТЕРМІНОВУ ЕВАКУАЦІЮ</h3>
                                    <p className="text-sm font-bold leading-relaxed">
                                        Повідомляємо що військовослужбовця в/ч 3052 Аврахова М.О. буде евакуйовано <span className="underline decoration-4 decoration-blue-300">16.02.2026 року</span>.
                                    </p>
                                    <div className="mt-8 p-3 bg-white/10 rounded-xl text-[10px] font-black text-center uppercase tracking-widest">
                                        Наказ направлено до в/ч 3052
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ВІЙСЬКОВИЙ КВИТОК ДЕТАЛІ */}
                    {view === 'military' && (
                        <div className="doc-overlay">
                            <Header title="Військовий квиток" />
                            <div className="p-6">
                                <div className="diia-gradient p-8 rounded-[40px] text-white shadow-2xl mb-6">
                                    <p className="text-xs font-bold opacity-50 uppercase mb-1">Серія та номер</p>
                                    <h2 className="text-4xl font-black tracking-tighter mb-8">AГ 042020</h2>
                                    <div className="space-y-4">
                                        <div><p className="text-[10px] font-bold opacity-50 uppercase">Посада</p><p className="font-black">Електрозварник 1-ї майстерні
Ремонту артилерійського озброєння 
Ремонтного взводу артилерійського озброєння
Роти з ремонту озброєння автотранспортного батальйону </p></div>
                                        <div><p className="text-[10px] font-bold opacity-50 uppercase">ВОС</p><p className="font-black">Г-131264</p></div>
                                    </div>
                                </div>
                                <div className="diia-card p-6">
                                    <p className="text-[10px] font-black text-gray-400 uppercase mb-4">Відомості</p>
                                    <p className="text-sm font-bold mb-4">Призов: 02.04.2022 р. за мобілізацією.</p>
                                    <p className="text-sm font-bold">Присяга: 07.04.2022 р. у в/ч 3052.</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
